[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eavf-mappo"
version = "0.1.0"
description = "Residual Execution-Aware Voronoi MAPPO core implementation"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "torch>=2.0",
  "matplotlib>=3.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["eavf_mappo*"]
